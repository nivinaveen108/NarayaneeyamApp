<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narayaneeyam Learning Hub</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-hover: rgba(44, 44, 46, 0.85);
      --primary-color: #fa233b; /* Apple Music Red / Pinkish accent */
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --border-color: rgba(255, 255, 255, 0.1);
      --blur-strength: blur(20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(250, 35, 59, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(94, 92, 230, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Top Selection & Navigation Bar */
    header {
      background: rgba(22, 22, 23, 0.8);
      backdrop-filter: var(--blur-strength);
      -webkit-backdrop-filter: var(--blur-strength);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .selector-row {
      display: flex;
      gap: 8px;
    }

    select {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: rgba(44, 44, 46, 0.6);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    select:focus {
      border-color: var(--primary-color);
      background-color: rgba(44, 44, 46, 0.9);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .dash-nav-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .dash-nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Main Content Viewport */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 160px; /* Space for bottom player */
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: var(--blur-strength);
      -webkit-backdrop-filter: var(--blur-strength);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .card.hidden {
      display: none;
    }

    .card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .content-text {
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-line;
      color: var(--text-main);
    }

    #verse {
      font-size: 1.3rem;
      font-weight: 500;
      text-align: center;
      color: #ffb3b8; /* Soft rosy accent for verses */
      letter-spacing: 0.01em;
    }

    /* Mobile Bottom Audio Dock (Apple Music style glassmorphism player) */
    .audio-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-color);
      padding: 14px 20px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    audio {
      width: 100%;
      height: 36px;
      filter: invert(1) hue-rotate(180deg) brightness(1.5); /* Sleek dark-mode adjustment for native audio element */
    }

    .dock-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    button.control-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    button.control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    button.control-btn.active {
      color: #ffffff;
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 12px rgba(250, 35, 59, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <!-- Two-level menu selectors -->
    <div class="selector-row">
      <select id="rangeSelect"></select>
      <select id="dashakamSelect"></select>
      <select id="langSelect">
        <option value="vtt_time_devanagari_english">Devanagari + English(IAST)</option>      
        <option value="vtt_fixed_output_time">Devanagari + English Meaning</option>
        <option value="vtt_fixed_time_transliterated">English(IAST) + Meaning</option>
        <option value="vtt_time__devanagari_malayalam">Devanagari + Malayalam</option>
        <option value="vtt_time_devanagari_tamil">Devanagari + Tamil</option>
        <option value="vtt_time_malayalam_translated">Malayalam Translated</option>
      </select>
    </div>

    <!-- Skip buttons row for Dashakams -->
    <div class="nav-row">
      <button id="prev10Btn" class="dash-nav-btn">⏪ -10 Dashakam</button>
      <button id="prev1Btn" class="dash-nav-btn">◀ -1 Dashakam</button>
      <button id="next1Btn" class="dash-nav-btn">+1 Dashakam ▶</button>
      <button id="next10Btn" class="dash-nav-btn">+10 Dashakam ⏩</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h3></h3>
      <div id="verse" class="content-text">Select a Dashakam to begin...</div>
    </div>
    <div id="wordCard" class="card">
      <h3></h3>
      <div id="splitWords" class="content-text"></div>
    </div>
    <div class="card">
      <h3></h3>
      <div id="meaning" class="content-text"></div>
    </div>
  </main>

  <div class="audio-dock">
    <audio id="audio" controls></audio>
    <div class="dock-controls">
      <button id="prevVerseBtn" class="control-btn">⏮️ Verse</button>
      <button id="repeatVerseBtn" class="control-btn">🔁 Verse</button>
      <button id="repeatDashakamBtn" class="control-btn">🔁 Dashakam</button>
      <button id="nextVerseBtn" class="control-btn">Verse ⏭️</button>
      <button id="speedBtn" class="control-btn" title="Playback Speed">1x</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rangeSelect = document.getElementById('rangeSelect');
      const dashakamSelect = document.getElementById('dashakamSelect');
      const langSelect = document.getElementById('langSelect');
      const audio = document.getElementById('audio');
      const verseDiv = document.getElementById('verse');
      const splitWordsDiv = document.getElementById('splitWords');
      const meaningDiv = document.getElementById('meaning');
      const wordCard = document.getElementById('wordCard');

      const repeatVerseBtn = document.getElementById('repeatVerseBtn');
      const repeatDashakamBtn = document.getElementById('repeatDashakamBtn');
      const prevVerseBtn = document.getElementById('prevVerseBtn');
      const nextVerseBtn = document.getElementById('nextVerseBtn');
      const speedBtn = document.getElementById('speedBtn');

      const prev10Btn = document.getElementById('prev10Btn');
      const prev1Btn = document.getElementById('prev1Btn');
      const next1Btn = document.getElementById('next1Btn');
      const next10Btn = document.getElementById('next10Btn');

      let cues = [];
      let currentCueIndex = -1;
      let repeatVerse = false;
      let repeatDashakam = false;
      const speedOptions = [1, 1.25, 1.5, 0.75];
      let speedIndex = 0;

      // Populate Range Dropdown (1-10, 11-20, etc.)
      for (let r = 1; r <= 100; r += 10) {
        const end = Math.min(r + 9, 100);
        const option = document.createElement('option');
        option.value = r;
        option.textContent = `Dashakams ${r}-${end}`;
        rangeSelect.appendChild(option);
      }

      // Populate sub-menu dashakams based on range start
      function populateDashakams(startNum, selectedVal = null) {
        dashakamSelect.innerHTML = '';
        const start = parseInt(startNum);
        const end = Math.min(start + 9, 100);

        for (let i = start; i <= end; i++) {
          const val = i.toString().padStart(3, '0');
          const option = document.createElement('option');
          option.value = val;
          option.textContent = `Dashakam ${val}`;
          dashakamSelect.appendChild(option);
        }

        if (selectedVal) {
          dashakamSelect.value = selectedVal;
        }
      }

      // Initialize with range 1-10 and dashakam 001
      populateDashakams(1, '001');

      rangeSelect.addEventListener('change', () => {
        populateDashakams(rangeSelect.value);
        loadContent();
      });

      function parseCueText(text, folderVal) {
        const lines = text.trim().split('\n');
        let verseLines = [], splitWordLines = [], meaningLines = [];
        let foundVerseEnd = false, foundMeaningStart = false;
        
        const verseEndRegex = /(\.\.\s*[0-9]+\s*\.\.|॥\s*[०-९0-9]+\s*॥)/;
        const isEnglishLine = line => /^[\x00-\x7F\s.,'"()\-:;!?]+$/.test(line.trim());

        // If it's the Malayalam translated format, handle it directly
        if (folderVal === 'vtt_time_malayalam_translated') {
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            if (!foundVerseEnd) {
              verseLines.push(trimmed);
              if (verseEndRegex.test(trimmed)) foundVerseEnd = true;
            } else {
              meaningLines.push(trimmed);
            }
          }
          return {
            verse: verseLines.join('\n'),
            splitWords: '',
            meaning: meaningLines.join('\n')
          };
        }

        // Standard parsing for multi-section script files
        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.includes('[Translation failed')) continue;

          if (!foundVerseEnd) {
            verseLines.push(trimmed);
            if (verseEndRegex.test(trimmed)) foundVerseEnd = true;
          } else if (!foundMeaningStart) {
            if (isEnglishLine(trimmed) && trimmed.length > 3 && !/[അ-ഹാ-ൗ്ംഃ]/g.test(trimmed)) {
              foundMeaningStart = true;
              meaningLines.push(trimmed);
            } else {
              splitWordLines.push(trimmed);
            }
          } else {
            meaningLines.push(trimmed);
          }
        }

        return {
          verse: verseLines.join('\n'),
          splitWords: splitWordLines.join('\n'),
          meaning: meaningLines.join('\n')
        };
      }

      function loadVTT(url) {
        return fetch(url)
          .then(res => { if (!res.ok) throw new Error(); return res.text(); })
          .then(text => {
            const lines = text.split('\n');
            let parsedCues = [], i = 0;
            while (i < lines.length) {
              const line = lines[i].trim();
              if (line.includes('-->')) {
                let [start, end] = line.split(' --> ').map(s => s.trim());
                let cueText = [];
                i++;
                while (i < lines.length && lines[i].trim() !== '') {
                  cueText.push(lines[i]);
                  i++;
                }
                parsedCues.push({ start, end, text: cueText.join('\n') });
              }
              i++;
            }
            return parsedCues;
          });
      }

      function timeToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return parseFloat(parts[2]) + parseInt(parts[1]) * 60 + parseInt(parts[0]) * 3600;
      }

      function updateActiveCueDisplay(index) {
        if (index >= 0 && index < cues.length) {
          currentCueIndex = index;
          const folderVal = langSelect.value;
          const parts = parseCueText(cues[currentCueIndex].text, folderVal);
          
          verseDiv.innerHTML = parts.verse.replace(/\n/g, '<br>');
          meaningDiv.innerHTML = parts.meaning.replace(/\n/g, '<br>');

          if (parts.splitWords.trim() === '') {
            wordCard.classList.add('hidden');
          } else {
            wordCard.classList.remove('hidden');
            splitWordsDiv.innerHTML = parts.splitWords.replace(/\n/g, '<br>');
          }
        }
      }

      function loadContent() {
        const dVal = dashakamSelect.value;
        const folderVal = langSelect.value;

        audio.src = `https://nivinaveen108.github.io/narayaneeyam_basic/audio/Narayaneeyam_D${dVal}.mp3`;
        audio.load();

        let vttUrl = '';
        if (folderVal === 'vtt_time_malayalam_translated') {
          vttUrl = `https://nivinaveen108.github.io/narayaneeyam/${folderVal}/Narayaneeyam_D${dVal}.vtt`;
        } else {
          vttUrl = `https://nivinaveen108.github.io/narayaneeyam_basic/${folderVal}/Narayaneeyam_D${dVal}.vtt`;
        }

        loadVTT(vttUrl)
          .then(loaded => {
            cues = loaded;
            currentCueIndex = -1;
            if (cues.length > 0) {
              audio.currentTime = timeToSeconds(cues[0].start);
              updateActiveCueDisplay(0);
            }
          })
          .catch(() => {
            verseDiv.textContent = "Subtitle file unavailable for this language folder.";
            splitWordsDiv.textContent = "";
            meaningDiv.textContent = "";
            wordCard.classList.remove('hidden');
          });
      }

      // Shift Dashakam by delta (+1, -1, +10, -10) with automatic two-level range synchronization
      function shiftDashakam(delta) {
        let currentNum = parseInt(dashakamSelect.value);
        let targetNum = currentNum + delta;

        if (targetNum > 100) targetNum = 100;
        if (targetNum < 1) targetNum = 1;

        let targetRangeStart = Math.floor((targetNum - 1) / 10) * 10 + 1;
        rangeSelect.value = targetRangeStart;
        populateDashakams(targetRangeStart, targetNum.toString().padStart(3, '0'));
        loadContent();
      }

      // Event Listeners
      dashakamSelect.addEventListener('change', loadContent);
      langSelect.addEventListener('change', loadContent);

      prev10Btn.addEventListener('click', () => shiftDashakam(-10));
      prev1Btn.addEventListener('click', () => shiftDashakam(-1));
      next1Btn.addEventListener('click', () => shiftDashakam(1));
      next10Btn.addEventListener('click', () => shiftDashakam(10));

      repeatVerseBtn.addEventListener('click', () => {
        repeatVerse = !repeatVerse;
        repeatVerseBtn.classList.toggle('active', repeatVerse);
      });

      repeatDashakamBtn.addEventListener('click', () => {
        repeatDashakam = !repeatDashakam;
        repeatDashakamBtn.classList.toggle('active', repeatDashakam);
      });

      prevVerseBtn.addEventListener('click', () => {
        if (cues.length > 0) {
          if (currentCueIndex <= 0) {
            currentCueIndex = 0;
          } else {
            currentCueIndex--;
          }
          audio.currentTime = timeToSeconds(cues[currentCueIndex].start);
          updateActiveCueDisplay(currentCueIndex);
        }
      });

      nextVerseBtn.addEventListener('click', () => {
        if (cues.length > 0) {
          if (currentCueIndex === -1 || currentCueIndex >= cues.length - 1) {
            currentCueIndex = 0;
          } else {
            currentCueIndex++;
          }
          audio.currentTime = timeToSeconds(cues[currentCueIndex].start);
          updateActiveCueDisplay(currentCueIndex);
        }
      });

      speedBtn.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speedOptions.length;
        audio.playbackRate = speedOptions[speedIndex];
        speedBtn.textContent = `${speedOptions[speedIndex]}x`;
      });

      audio.addEventListener('timeupdate', () => {
        if (!cues.length) return;
        const ct = audio.currentTime;

        const newIndex = cues.findIndex(c => ct >= timeToSeconds(c.start) && ct <= timeToSeconds(c.end));

        if (newIndex !== -1 && newIndex !== currentCueIndex) {
          updateActiveCueDisplay(newIndex);
        }

        // Repeat Logic
        if (repeatVerse && currentCueIndex !== -1) {
          if (ct >= timeToSeconds(cues[currentCueIndex].end)) {
            audio.currentTime = timeToSeconds(cues[currentCueIndex].start);
          }
        }
        if (repeatDashakam && currentCueIndex === cues.length - 1) {
          if (ct >= timeToSeconds(cues[currentCueIndex].end)) {
            audio.currentTime = 0;
          }
        }
      });

      // Initial load & fix for audio not being interacted/loaded yet on load
      loadContent();
    });
  </script>
</body>
</html>
